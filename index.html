<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Успенівська гімназія — Авторизація</title>
    <!-- Підключаємо Tailwind CSS для гарного стилю -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Підключаємо EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Успенівська гімназія</h1>

        <!-- Форма входу / реєстрації -->
        <div id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Електронна пошта</label>
                <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Ім'я</label>
                <input type="text" id="name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <button onclick="startRegistration()" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition">
                Зареєструватися / Отримати код
            </button>
        </div>

        <!-- Поле введення коду (спочатку приховане) -->
        <div id="verification-section" class="hidden space-y-4 mt-6">
            <p class="text-sm text-gray-600 text-center">Введіть 6-значний код, надісланий на вашу пошту:</p>
            <input type="text" id="verification-code-input" placeholder="123456" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-center tracking-widest text-lg">
            
            <button onclick="verifyUserCode()" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition">
                Підтвердити код
            </button>
        </div>

        <!-- Панель успішного входу (спочатку прихована) -->
        <div id="success-screen" class="hidden text-center space-y-4 mt-6">
            <h2 class="text-xl font-semibold text-green-600">Ви успішно авторизувались! 🎉</h2>
            <p class="text-gray-600">Ласкаво просимо до системи Успенівської гімназії.</p>
            <button onclick="logout()" class="text-sm text-red-600 underline hover:text-red-800">Вийти з аккаунта</button>
        </div>
    </div>

    <!-- Логіка JavaScript -->
    <script>
        // Ініціалізація EmailJS вашими даними
        (function() {
            emailjs.init("tLbVdUQH1-ZzQifRM");
        })();

        const EMAILJS_SERVICE_ID = "service_s0qr3nc";
        const EMAILJS_TEMPLATE_ID = "template_urh5mpl";

        // Генерація коду
        function generateCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // Крок 1: Відправка коду на пошту
        async function startRegistration() {
            const email = document.getElementById("email").value;
            const name = document.getElementById("name").value;

            if (!email || !name) {
                alert("Будь ласка, заповніть пошту та ім'я!");
                return;
            }

            const code = generateCode();
            localStorage.setItem("pending_code", code);
            localStorage.setItem("user_name", name);

            // Показуємо сповіщення про завантаження
            alert("Надсилаємо код підтвердження на пошту...");

            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_email: email,
                    to_name: name,
                    verification_code: code
                });

                alert("Лист успішно надіслано! Перевірте пошту (і спам).");
                
                // Ховаємо форму пошти, показуємо поле введення коду
                document.getElementById("auth-form").classList.add("hidden");
                document.getElementById("verification-section").classList.remove("hidden");

            } catch (error) {
                console.error("Помилка:", error);
                alert("Не вдалося надіслати лист. Перевірте правильність пошти.");
            }
        }

        // Крок 2: Перевірка введеного коду
        function verifyUserCode() {
            const enteredCode = document.getElementById("verification-code-input").value;
            const savedCode = localStorage.getItem("pending_code");

            if (enteredCode === savedCode) {
                // Успіх! Очищаємо тимчасовий код
                localStorage.removeItem("pending_code");
                localStorage.setItem("is_logged_in", "true");

                // Ховаємо секцію коду, показуємо екран успіху
                document.getElementById("verification-section").classList.add("hidden");
                document.getElementById("success-screen").classList.remove("hidden");
            } else {
                alert("Невірний код! Спробуйте ще раз.");
            }
        }

        // Вихід з аккаунта
        function logout() {
            localStorage.removeItem("is_logged_in");
            location.reload(); // Перезавантажує сторінку назад до форми
        }

        // Перевірка при завантаженні сторінки: чи користувач вже увійшов?
        window.onload = function() {
            if (localStorage.getItem("is_logged_in") === "true") {
                document.getElementById("auth-form").classList.add("hidden");
                document.getElementById("success-screen").classList.remove("hidden");
            }
        };
    </script>
</body>
</html>
